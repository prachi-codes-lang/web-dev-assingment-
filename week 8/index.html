<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header class="header">
            <h2>My Dashboard</h2>
            <span>Welcome Back!</span>
        </header>

        <aside class="sidebar">
            <h3>Menu</h3>
            <p>🏠 Home</p>
            <p>📊 Analytics</p>
            <p>👤 Profile</p>
            <p>⚙️ Settings</p>
        </aside>

        <main class="main">
            <h2>Dashboard Overview</h2>

            <div class="grid-container">

                <div class="box">
                    <span>📈</span>
                    <p>Total Sales</p>
                </div>

                <div class="box">
                    <span>👥</span>
                    <p>Total Users</p>
                </div>

                <div class="box">
                    <span>💰</span>
                    <p>Revenue</p>
                </div>

                <div class="box">
                    <span>📦</span>
                    <p>Orders</p>
                </div>

                <div class="box">
                    <span>⭐</span>
                    <p>Reviews</p>
                </div>

                <div class="box">
                    <span>📅</span>
                    <p>Events</p>
                </div>

            </div>
        </main>

        <footer class="footer">
            <p>© 2026 My Dashboard | All Rights Reserved</p>
        </footer>

    </div>

</body>
</html>
